<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maschinenraum</title>
<style>
:root{--panel:rgba(8,12,16,.9);--line:#164854;--text:#e7f6ff;--muted:#8eb4c0;--cyan:#2ee6ff}
html,body{margin:0;height:100%;background:#06090d;overflow:hidden;font:13px/1.4 -apple-system,system-ui,sans-serif;color:var(--text)}
#c{position:fixed;inset:0}
#labels{position:fixed;inset:0;pointer-events:none}
.tag{font-size:11px;font-weight:600;color:#1e293b;background:rgba(255,255,255,.88);padding:1px 7px;border-radius:99px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);text-align:center}
.tag small{display:block;font-weight:500;color:#475569;font-size:10px}
.bubble{font-size:12px;font-weight:600;background:#0f172a;color:#f1f5f9;padding:5px 10px;border-radius:10px;white-space:nowrap;border:2px solid var(--c,#38bdf8);transform:translateY(-6px)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--c,#38bdf8)}
.bubble{position:relative}
.bubble.klick{pointer-events:auto;cursor:pointer}.bubble.klick:hover{background:#1e293b}
#top{position:fixed;left:12px;right:12px;top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
#top>*{pointer-events:auto}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;backdrop-filter:blur(8px)}
h1{font-size:13px;margin:0;letter-spacing:.14em;text-transform:uppercase}
.badge{font-size:11px;color:#facc15;margin-left:6px}
button{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px 11px;border-radius:9px;cursor:pointer;font:inherit;backdrop-filter:blur(8px)}
button.on,button:hover{border-color:var(--cyan);color:#bae6fd}
#clock{font-variant-numeric:tabular-nums;color:var(--muted)}
.look label{display:flex;gap:8px;align-items:center}
.look select{background:#0c141c;color:var(--text);border:1px solid var(--cyan);border-radius:7px;padding:3px 8px;font:inherit;font-weight:600;min-width:7.2em;cursor:pointer}
.look select:hover,.look select:focus{color:#bae6fd}
#side{position:fixed;right:12px;top:58px;width:290px;max-height:calc(100% - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;backdrop-filter:blur(8px)}
#side h2{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:6px 8px}
.ag{display:flex;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}
.ag:hover,.ag.sel{background:rgba(56,189,248,.1)}
.dot{width:13px;height:13px;border-radius:50%;margin-top:3px;flex:none}
.ag b{display:block;font-weight:600}.ag small{display:block;color:var(--muted)}
.job{display:flex;gap:8px;padding:3px 8px 3px 24px}.job .dot{width:9px;height:9px;margin-top:5px}.job b{font-weight:600;font-size:12px}.job small{display:block;color:var(--muted);font-size:11px}
details summary{cursor:pointer;padding:6px 8px;display:flex;gap:8px;align-items:center;list-style:none;border-radius:8px}details summary:hover{background:rgba(56,189,248,.1)}details summary small{color:var(--muted)}details summary .dot{margin-top:0}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,94vw);max-height:84vh;overflow:auto;background:rgba(8,12,16,.96);border:1px solid var(--line);border-radius:14px;z-index:5;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#panel[hidden]{display:none}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,12,16,.98)}
.ph b{font-size:16px;flex:1}.ph small{color:var(--muted)}
#pb{padding:10px 14px 16px}
.pj{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.pjh{display:flex;gap:10px;align-items:flex-start}.pjh b{display:block}.pjh small{display:block;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.btns button{padding:5px 10px;font-size:12px}
.btns button.go{border-color:#22c55e}.btns button.warn{border-color:#f59e0b}.btns button.bad{border-color:#ef4444}
.out{margin-top:8px;font-size:12px}.out pre{white-space:pre-wrap;background:#020617;border-radius:8px;padding:8px;max-height:220px;overflow:auto;color:#cbd5e1;font-size:11px}
.diag{padding:8px 10px;border-radius:8px;margin:6px 0;font-weight:600}.diag.err{background:rgba(239,68,68,.15);color:#fecaca}.diag.ok{background:rgba(34,197,94,.15);color:#bbf7d0}
.tip{color:var(--muted);font-size:11px;margin:4px 8px 8px}
.brosch{pointer-events:auto;cursor:pointer;font-size:12px;font-weight:700;background:#38bdf8;color:#04121f;padding:3px 9px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.mchat{max-height:42vh;overflow:auto;margin:8px 0}.msg{padding:8px 11px;border-radius:12px;margin:6px 0;white-space:pre-wrap;font-size:13px;line-height:1.45}
.msg.du{background:#1e3a5f;margin-left:48px}.msg.mu{background:#2b1838;margin-right:48px;border:1px solid #6b2f57}.msg.sys{color:var(--muted);font-size:12px}
#mtext{width:100%;box-sizing:border-box;background:#020617;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;resize:vertical}
.auf{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:5px 0;font-size:12px}.auf div{flex:1;white-space:pre-wrap}.auf.erledigt div{text-decoration:line-through;color:var(--muted)}
.mutter{background:#f472b6;color:#2a0b1c}
#ctx{position:fixed;z-index:6;background:rgba(8,12,16,.97);border:1px solid var(--line);border-radius:10px;padding:5px;min-width:230px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#ctx[hidden]{display:none}#ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px}#ctx button:hover{background:rgba(56,189,248,.15)}#ctx button:disabled{opacity:.4}#ctx div{font-size:11px;color:var(--muted);padding:4px 10px}
.vs{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.vs b{display:block;margin-bottom:3px}.vs small{color:var(--muted)}
#views{position:fixed;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:760px){#side{top:auto;bottom:56px;right:8px;left:8px;width:auto;max-height:30vh}}
#intro{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 42%,#0e2c36,#05080c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .9s}
#intro.hide{opacity:0;pointer-events:none}
#intro button{background:none;border:0;padding:0;color:var(--cyan)}
#intro svg{width:130px;height:130px;animation:spin 14s linear infinite;filter:drop-shadow(0 0 18px #38bdf899)}
#intro button:hover svg{animation-duration:3s}
#intro p{margin:0;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.zettel{pointer-events:auto;cursor:pointer;font-size:12px;font-weight:700;background:#dbeafe;color:#1e3a8a;border:2px solid #2563eb;padding:3px 8px;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.4);transform:rotate(-3deg);white-space:nowrap}
.zettel-protokoll{font-size:11px;white-space:pre-wrap;max-height:260px;overflow:auto;background:rgba(0,0,0,.25);padding:6px;border-radius:6px;margin:6px 0}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="intro"><button id="enter" aria-label="Maschinenraum betreten"><svg viewBox="-60 -60 120 120"><g fill="currentColor" id="teeth"></g><circle r="38" fill="currentColor"/><circle r="16" fill="#05080f"/></svg></button><p>Einstellungen · Maschinenraum betreten</p><div class="pill look" id="look-intro"></div></div>
<div id="c"></div><div id="labels"></div>
<div id="top">
  <div class="pill"><h1><span id="titel">Maschinenraum</span><span class="badge" style="color:#4ade80">live</span></h1></div>
  <div class="pill" id="clock"></div>
  <div class="pill look" id="look-top"></div>
  <button id="gear" title="Zurück zum Zahnrad">⚙︎</button>
</div>
<div id="ctx" hidden></div><div id="panel" hidden><div class="ph"><span class="dot" id="pd"></span><b id="pt"></b><button id="px">✕</button></div><div id="pb"></div></div>
<div id="side"><h2>Agenten</h2><div class="tip">Tipp: Bot oder Aufgabe anklicken → Bedienfeld · Rechtsklick → Sekretariat</div><div id="list"></div><h2>Alle Aufgaben</h2><div id="jobs"></div></div>
<div id="views"></div>
<script>
document.getElementById('enter').addEventListener('click',()=>{document.getElementById('intro').classList.add('hide');window.__enterAsked=true});
const teeth=document.getElementById('teeth');for(let i=0;i<10;i++)teeth.insertAdjacentHTML('beforeend',`<rect x="-9" y="-56" width="18" height="22" rx="3" transform="rotate(${i*36})"/>`);
</script>
<script type="module" src="app.js"></script>
</body>
</html>
